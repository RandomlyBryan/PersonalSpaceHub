<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonalSpace - Team Project Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        jokerPurple: "#3c096c",
                        jokerGreen: "#39ff14",
                        overdueRed: "#ff003c"
                    }
                }
            }
        }
    </script>

    <style>
        body { background: linear-gradient(135deg, #9d4edd, #70e000); min-height: 100vh; transition: background 0.5s ease; overflow: hidden; }
        .dark body { background: linear-gradient(135deg, #10002b, #004b23); }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(157, 78, 221, 0.3); }
        .dark .glass-panel { background: rgba(20, 10, 40, 0.85); color: #e2e8f0; border: 1px solid rgba(57, 255, 20, 0.1); }
        
        /* High Urgency/Overdue Pulse */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); }
        }
        .urgent-pulse { animation: pulse-red 2s infinite; border: 2px solid #ff003c !important; }

        .sidebar { background: rgba(36, 0, 70, 0.7); backdrop-filter: blur(20px); }
        .nav-item.active { background: rgba(255, 255, 255, 0.1); border-left: 4px solid #39ff14; color: #39ff14; }
        .column-body { min-height: 300px; }
        
        .filter-btn { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .filter-btn.active { background: #39ff14; color: black; font-weight: bold; border-color: #39ff14; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(157, 78, 221, 0.5); border-radius: 3px; }
    </style>
</head>
<body class="text-slate-800 antialiased flex flex-col h-screen w-screen overflow-hidden">

    <div id="login-overlay" class="fixed inset-0 flex items-center justify-center transition-opacity duration-500 z-[200]">
        <div class="glass-panel p-8 rounded-3xl w-full max-sm:w-[90%] max-w-sm border-2 border-jokerPurple shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-jokerGreen tracking-tighter">PersonalSpace</h1>
                <p class="text-white/50 text-[10px] uppercase tracking-widest">Secure Team Entry</p>
            </div>
            <div class="space-y-4">
                <select id="login-username" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white outline-none appearance-none cursor-pointer">
                    <option value="Admin">Admin</option>
                </select>
                <input type="password" id="login-password" placeholder="Password" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white outline-none">
                <button onclick="handleLogin()" class="w-full bg-jokerGreen hover:bg-green-400 text-black font-black py-3 rounded-xl transition">ACCESS SYSTEM</button>
                <p id="login-error" class="text-red-400 text-center text-xs hidden">Invalid Credentials</p>
            </div>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden relative">
        <aside class="sidebar w-64 flex-shrink-0 flex flex-col justify-between h-full z-20">
            <div class="p-6 text-white flex items-center gap-3">
                <div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center border border-green-400/50">
                    <i class="fas fa-user-astronaut text-green-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-green-400">PersonalSpace</h1>
                    <p class="text-[9px] text-white/60 uppercase">Project Hub</p>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-2">
                <button onclick="switchView('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-3 text-white px-4 py-3 rounded-r-lg active">
                    <i class="fas fa-home"></i> Dashboard
                </button>
                <button onclick="switchView('kanban')" id="nav-kanban" class="nav-item w-full flex items-center gap-3 text-white px-4 py-3 rounded-r-lg">
                    <i class="fas fa-tasks"></i> Task Tracker
                </button>
            </nav>

            <div class="p-4 border-t border-purple-500/30">
                <button onclick="toggleTheme()" class="w-full text-green-400 text-xs flex items-center justify-center gap-2">
                    <i class="fas fa-moon" id="theme-icon"></i> Toggle Theme
                </button>
                <button onclick="logout()" class="w-full mt-4 text-red-400 text-xs flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 relative h-full overflow-hidden flex flex-col bg-white/5">
            
            <div id="view-dashboard" class="flex-1 p-6 overflow-y-auto">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-4xl font-bold text-white" id="clock">00:00</h2>
                        <p class="text-green-400 font-bold" id="date">Loading...</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-bold text-white" id="greeting">Hello, User.</p>
                        <span class="bg-jokerGreen/20 text-jokerGreen px-2 py-1 rounded text-[10px] font-bold uppercase">Member Workspace</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="glass-panel p-6 rounded-2xl md:col-span-2">
                        <h3 class="font-bold mb-4 text-purple-400"><i class="fas fa-sticky-note mr-2"></i> Private Notepad</h3>
                        <textarea id="notepad" class="w-full h-48 bg-transparent border border-white/10 rounded-xl p-4 text-white outline-none resize-none" onchange="saveNotes(this.value)" placeholder="Start typing..."></textarea>
                    </div>
                    <div class="glass-panel p-6 rounded-2xl">
                        <h3 class="font-bold mb-4 text-green-400"><i class="fas fa-bolt mr-2"></i> Urgent Tasks</h3>
                        <div id="urgent-list" class="space-y-3"></div>
                    </div>
                </div>
            </div>

            <div id="view-kanban" class="flex-1 p-6 hidden flex flex-col h-full overflow-hidden">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 shrink-0 gap-4">
                    <div class="flex-1">
                        <h2 class="text-2xl font-bold text-green-400">Task Tracker</h2>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[10px] text-white/50 uppercase font-bold tracking-widest">Time Horizon:</span>
                            <div class="flex bg-black/40 p-1 rounded-lg border border-white/10">
                                <button onclick="setHorizon('all')" id="hz-all" class="filter-btn active text-[9px] px-3 py-1 rounded">ALL</button>
                                <button onclick="setHorizon('week')" id="hz-week" class="filter-btn text-[9px] px-3 py-1 rounded text-white/60">WEEK</button>
                                <button onclick="setHorizon('month')" id="hz-month" class="filter-btn text-[9px] px-3 py-1 rounded text-white/60">MONTH</button>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <button onclick="openTaskModal()" class="bg-jokerGreen hover:bg-green-400 text-black font-black px-4 py-2 rounded-xl text-xs transition">
                            <i class="fas fa-plus mr-1"></i> NEW TASK
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 overflow-hidden h-full">
                    <div class="flex flex-col h-full overflow-hidden">
                        <div class="p-3 bg-white/10 rounded-t-xl border-t-4 border-slate-400 flex justify-between font-bold text-white text-sm">
                            <span>TO DO</span><span id="count-todo">0</span>
                        </div>
                        <div class="column-body p-3 bg-white/5 rounded-b-xl overflow-y-auto space-y-3" ondrop="drop(event, 'todo')" ondragover="allowDrop(event)"></div>
                    </div>

                    <div class="flex flex-col h-full overflow-hidden">
                        <div class="p-3 bg-white/10 rounded-t-xl border-t-4 border-jokerPurple flex justify-between font-bold text-white text-sm">
                            <span>IN PROGRESS</span><span id="count-inprogress">0</span>
                        </div>
                        <div class="column-body p-3 bg-white/5 rounded-b-xl overflow-y-auto space-y-3" ondrop="drop(event, 'inprogress')" ondragover="allowDrop(event)"></div>
                    </div>

                    <div class="flex flex-col h-full overflow-hidden">
                        <div class="p-3 bg-white/10 rounded-t-xl border-t-4 border-jokerGreen flex justify-between font-bold text-white text-sm">
                            <span>EXECUTED</span><span id="count-done">0</span>
                        </div>
                        <div class="column-body p-3 bg-white/5 rounded-b-xl overflow-y-auto space-y-3" ondrop="drop(event, 'done')" ondragover="allowDrop(event)"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="task-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-[300] p-4">
        <div class="glass-panel p-6 rounded-3xl w-full max-w-md border-2 border-jokerPurple">
            <h2 class="text-xl font-bold mb-4 text-white">Task Details</h2>
            <input type="hidden" id="task-id">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-white/50 uppercase font-bold">Title</label>
                    <input type="text" id="task-title" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-2 text-white outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] text-white/50 uppercase font-bold">Priority</label>
                        <select id="task-priority" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-2 text-white outline-none">
                            <option value="1">Low</option>
                            <option value="3">Medium</option>
                            <option value="5">High (Pulses)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-white/50 uppercase font-bold">Due Date</label>
                        <input type="date" id="task-date" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-2 text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-white/50 uppercase font-bold">Description</label>
                    <textarea id="task-desc" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-2 text-white outline-none h-24"></textarea>
                </div>
                <div class="flex justify-between mt-6">
                    <button onclick="deleteTask()" id="btn-delete" class="text-red-400 text-xs hidden">Delete Task</button>
                    <div class="flex gap-2 ml-auto">
                        <button onclick="closeModal('task-modal')" class="text-white/50 text-xs px-4">Cancel</button>
                        <button onclick="saveTask()" class="bg-jokerGreen text-black font-bold px-6 py-2 rounded-xl text-xs">Save Task</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCvfwF-_by5hoUIVoEowKwbzzKF3YkJWy0",
            authDomain: "personalspacehub-3a44d.firebaseapp.com",
            projectId: "personalspacehub-3a44d",
            databaseURL: "https://personalspacehub-3a44d-default-rtdb.firebaseio.com/",
            storageBucket: "personalspacehub-3a44d.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- STATE ---
        const store = {
            currentUser: null,
            kanbanTasks: [],
            horizon: 'all', // 'all', 'week', 'month'
            theme: 'light',
            notes: ''
        };

        let draggedId = null;

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateClock, 1000);
            updateClock();

            // Load session
            const savedUser = localStorage.getItem('ps_user');
            if(savedUser) {
                store.currentUser = savedUser;
                document.getElementById('login-overlay').classList.add('hidden');
                initDataSync();
            }

            // Global Timer Update
            setInterval(() => {
                if(store.currentUser) renderKanbanBoard();
            }, 1000);
        });

        function initDataSync() {
            db.ref('projectData').on('value', snap => {
                const data = snap.val() || {};
                store.kanbanTasks = data.kanbanTasks || [];
                store.notes = (data.userData && data.userData[store.currentUser]) ? data.userData[store.currentUser].notes : '';
                
                document.getElementById('notepad').value = store.notes;
                document.getElementById('greeting').textContent = `Hello, ${store.currentUser}.`;
                renderKanbanBoard();
                renderUrgentDashboard();
            });
        }

        // --- AUTH ---
        function handleLogin() {
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            if(p === "1234") { // Simplified for demo
                store.currentUser = u;
                localStorage.setItem('ps_user', u);
                document.getElementById('login-overlay').classList.add('hidden');
                initDataSync();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('ps_user');
            location.reload();
        }

        // --- FILTERS ---
        function setHorizon(h) {
            store.horizon = h;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active', 'text-black'));
            document.getElementById(`hz-${h}`).classList.add('active', 'text-black');
            renderKanbanBoard();
        }

        function isTaskInHorizon(t) {
            if (store.horizon === 'all') return true;
            if (!t.assignedDate) return false;

            const taskDate = new Date(t.assignedDate);
            const today = new Date();

            if (store.horizon === 'month') {
                return taskDate.getMonth() === today.getMonth() && taskDate.getFullYear() === today.getFullYear();
            }

            if (store.horizon === 'week') {
                const start = new Date(today);
                start.setDate(today.getDate() - today.getDay());
                const end = new Date(start);
                end.setDate(start.getDate() + 6);
                return taskDate >= start && taskDate <= end;
            }
            return true;
        }

        // --- RENDERING ---
        function renderKanbanBoard() {
            const columns = ['todo', 'inprogress', 'done'];
            columns.forEach(status => {
                const container = document.querySelector(`[ondrop="drop(event, '${status}')"]`);
                const tasks = store.kanbanTasks.filter(t => 
                    t.status === status && 
                    isTaskInHorizon(t) && 
                    (t.assignee === store.currentUser || !t.assignee)
                );
                
                document.getElementById(`count-${status}`).textContent = tasks.length;
                container.innerHTML = '';
                
                tasks.forEach(t => {
                    const isOverdue = t.assignedDate && new Date(t.assignedDate) < new Date().setHours(0,0,0,0) && t.status !== 'done';
                    const isUrgent = t.priority == 5 || isOverdue;

                    const el = document.createElement('div');
                    el.draggable = true;
                    el.ondragstart = (e) => draggedId = t.id;
                    el.className = `p-4 rounded-xl bg-white/10 border border-white/20 transition cursor-grab active:cursor-grabbing ${isUrgent ? 'urgent-pulse' : ''}`;
                    
                    const timeSpent = t.log ? t.log.inprogress || 0 : 0;
                    const displayTime = formatTime(timeSpent + ( (t.status === 'inprogress' && !t.isPaused) ? Math.floor((Date.now() - t.lastMoved)/1000) : 0 ));

                    el.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="text-white font-bold text-sm ${t.isPaused ? 'opacity-50 italic' : ''}">${t.title}</h4>
                            <button onclick="openTaskModal('${t.id}')" class="text-white/30 hover:text-white"><i class="fas fa-edit text-xs"></i></button>
                        </div>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-[9px] text-white/40 uppercase font-black">${t.assignedDate || 'No Date'}</span>
                            <div class="flex items-center gap-2">
                                ${status === 'inprogress' ? `
                                    <button onclick="togglePause('${t.id}')" class="text-xs ${t.isPaused ? 'text-green-400' : 'text-amber-400'}">
                                        <i class="fas ${t.isPaused ? 'fa-play' : 'fa-pause'}"></i>
                                    </button>
                                ` : ''}
                                <span class="text-[10px] text-white font-mono bg-black/30 px-2 py-0.5 rounded">${displayTime}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(el);
                });
            });
        }

        function renderUrgentDashboard() {
            const list = document.getElementById('urgent-list');
            const urgents = store.kanbanTasks.filter(t => t.priority == 5 && t.status !== 'done');
            list.innerHTML = urgents.length ? '' : '<p class="text-white/20 text-xs italic">No critical blockers.</p>';
            urgents.forEach(t => {
                const div = document.createElement('div');
                div.className = "p-3 bg-red-500/10 border-l-4 border-red-500 rounded text-white text-xs flex justify-between";
                div.innerHTML = `<span>${t.title}</span><span class="font-bold text-red-400">HIGH</span>`;
                list.appendChild(div);
            });
        }

        // --- TASK LOGIC ---
        function saveTask() {
            const id = document.getElementById('task-id').value;
            const newTask = {
                id: id || Date.now().toString(),
                title: document.getElementById('task-title').value,
                desc: document.getElementById('task-desc').value,
                priority: document.getElementById('task-priority').value,
                assignedDate: document.getElementById('task-date').value,
                status: 'todo',
                assignee: store.currentUser,
                log: { inprogress: 0 },
                lastMoved: Date.now(),
                isPaused: false
            };

            if(id) {
                const idx = store.kanbanTasks.findIndex(t => t.id === id);
                newTask.status = store.kanbanTasks[idx].status; // preserve status
                store.kanbanTasks[idx] = {...store.kanbanTasks[idx], ...newTask};
            } else {
                store.kanbanTasks.push(newTask);
            }
            pushData();
            closeModal('task-modal');
        }

        function togglePause(id) {
            const t = store.kanbanTasks.find(x => x.id === id);
            const now = Date.now();
            if(!t.isPaused) {
                t.log.inprogress += Math.floor((now - t.lastMoved) / 1000);
                t.isPaused = true;
            } else {
                t.isPaused = false;
            }
            t.lastMoved = now;
            pushData();
        }

        function drop(e, status) {
            const t = store.kanbanTasks.find(x => x.id === draggedId);
            if(t.status === 'inprogress' && !t.isPaused) {
                t.log.inprogress += Math.floor((Date.now() - t.lastMoved) / 1000);
            }
            t.status = status;
            t.lastMoved = Date.now();
            t.isPaused = false;
            pushData();
        }

        // --- UTILS ---
        function pushData() { db.ref('projectData/kanbanTasks').set(store.kanbanTasks); }
        function saveNotes(v) { db.ref(`projectData/userData/${store.currentUser}/notes`).set(v); }
        function allowDrop(e) { e.preventDefault(); }
        function formatTime(s) {
            const h = Math.floor(s/3600);
            const m = Math.floor((s%3600)/60);
            return `${h}h ${m}m ${s%60}s`;
        }
        function updateClock() {
            const n = new Date();
            document.getElementById('clock').textContent = n.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('date').textContent = n.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
        }
        function switchView(v) {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-kanban').classList.add('hidden');
            document.getElementById(`view-${v}`).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`nav-${v}`).classList.add('active');
        }
        function openTaskModal(id) {
            document.getElementById('task-modal').classList.remove('hidden');
            const t = store.kanbanTasks.find(x => x.id === id) || {title:'', desc:'', priority:1, assignedDate:''};
            document.getElementById('task-id').value = id || '';
            document.getElementById('task-title').value = t.title;
            document.getElementById('task-desc').value = t.desc || '';
            document.getElementById('task-priority').value = t.priority;
            document.getElementById('task-date').value = t.assignedDate;
            document.getElementById('btn-delete').classList.toggle('hidden', !id);
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function toggleTheme() {
            store.theme = store.theme === 'light' ? 'dark' : 'light';
            document.body.classList.toggle('dark');
        }
        function deleteTask() {
            const id = document.getElementById('task-id').value;
            store.kanbanTasks = store.kanbanTasks.filter(t => t.id !== id);
            pushData();
            closeModal('task-modal');
        }
    </script>
</body>
</html>
