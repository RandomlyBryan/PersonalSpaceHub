<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonalSpace - Team Project Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        glass: "rgba(255, 255, 255, 0.95)",
                        darkGlass: "rgba(30, 41, 59, 0.95)",
                        sidebar: "rgba(36, 0, 70, 0.85)",
                        jokerPurple: "#3c096c",
                        jokerGreen: "#39ff14"
                    }
                }
            }
        }
    </script>

    <style>
        body { background: linear-gradient(135deg, #9d4edd, #70e000); min-height: 100vh; transition: background 0.5s ease; overflow: hidden; font-family: 'Inter', sans-serif; }
        .dark body { background: linear-gradient(135deg, #10002b, #004b23); }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(157, 78, 221, 0.3); box-shadow: 0 8px 32px 0 rgba(60, 9, 108, 0.2); }
        .dark .glass-panel { background: rgba(20, 10, 40, 0.85); color: #e2e8f0; border: 1px solid rgba(57, 255, 20, 0.1); }
        .sidebar { background: rgba(36, 0, 70, 0.7); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); }
        .dark .sidebar { background: rgba(10, 0, 20, 0.8); }
        .nav-item.active { background: rgba(255, 255, 255, 0.1); border-left: 4px solid #39ff14; color: #39ff14; }
        .column-body { min-height: 200px; transition: background-color 0.2s; }
        .column-body.drag-over { background-color: rgba(57, 255, 20, 0.15); border-radius: 0.5rem; }
        .task-card { cursor: grab; }
        .dragging { opacity: 0.5; transform: scale(0.98); }
        
        /* Calendar UI */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid #e2e8f0; border-left: 1px solid #e2e8f0; }
        .dark .calendar-grid { border-color: #3c096c; }
        .calendar-day { min-height: 80px; max-height: 110px; overflow-y: auto; padding: 4px; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; background: rgba(255,255,255,0.4); }
        .dark .calendar-day { border-color: #3c096c; background: rgba(30, 41, 59, 0.4); }
        .cal-event-item { font-size: 0.65rem; padding: 4px 5px; border-radius: 3px; margin-top: 2px; border-left: 3px solid #ccc; color: #334155; }
        .dark .cal-event-item { background: rgba(15, 23, 42, 0.6); color: #e2e8f0; }
        .cal-urgency-high { border-left-color: #ef4444 !important; background: rgba(239, 68, 68, 0.1); }
        .cal-task-critical { border-left-color: #f97316 !important; background: rgba(249, 115, 22, 0.15) !important; border-style: dashed; }
        
        .flatpickr-calendar { background: #1e293b !important; border: 1px solid #39ff14 !important; }
    </style>
</head>
<body class="text-slate-800 antialiased flex flex-col h-screen w-screen overflow-hidden">

    <div id="login-overlay" class="fixed inset-0 flex items-center justify-center transition-opacity duration-500 z-[200] bg-[#10002b]">
        <div class="glass-panel p-8 rounded-3xl w-full max-w-sm border-2 border-jokerPurple shadow-2xl">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-jokerPurple rounded-2xl flex items-center justify-center border-2 border-jokerGreen">
                    <i class="fas fa-user-astronaut text-jokerGreen text-3xl"></i>
                </div>
            </div>
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-jokerGreen">PersonalSpace</h1>
                <p class="text-white/50 text-[10px] uppercase tracking-widest">Secure Entry</p>
            </div>
            <div class="space-y-4">
                <select id="login-username" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-jokerGreen">
                    <option value="Admin">★ Admin</option>
                </select>
                <input type="password" id="login-password" placeholder="Password" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white outline-none focus:border-jokerGreen">
                <button onclick="handleLogin()" class="w-full bg-jokerGreen hover:bg-green-400 text-black font-black py-3 rounded-xl transition shadow-lg">ACCESS SYSTEM</button>
                <p id="login-error" class="text-red-400 text-[10px] text-center font-bold hidden uppercase">Invalid Credentials</p>
            </div>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden relative">
        <aside class="sidebar w-64 flex-shrink-0 flex flex-col justify-between h-full z-20 sidebar">
            <div class="p-6 text-white flex items-center gap-3">
                <div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center border border-green-400">
                    <i class="fas fa-user-astronaut text-green-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-green-400">PersonalSpace</h1>
                    <p class="text-[9px] text-white/60 uppercase">Project Hub</p>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-2">
                <button onclick="switchView('dashboard')" id="nav-dashboard" class="nav-item active w-full flex items-center gap-3 text-white px-4 py-3 rounded-lg transition hover:bg-white/10">
                    <i class="fas fa-home w-5"></i> Dashboard
                </button>
                <button onclick="switchView('kanban')" id="nav-kanban" class="nav-item w-full flex items-center gap-3 text-white px-4 py-3 rounded-lg transition hover:bg-white/10">
                    <i class="fas fa-tasks w-5"></i> Task Tracker
                </button>
                <button onclick="generateDailyReport()" class="w-full flex items-center gap-3 text-white px-4 py-3 rounded-lg transition hover:bg-green-500/20 text-sm font-bold border-l-4 border-transparent hover:border-jokerGreen">
                    <i class="fas fa-file-alt w-5 text-jokerGreen"></i> Daily Summary
                </button>
            </nav>

            <div class="p-4 border-t border-purple-500/30">
                <div id="active-user-display" class="bg-purple-900/50 rounded px-3 py-2 text-sm text-white flex justify-between items-center mb-4">
                    <span id="current-user-name">Admin</span>
                    <button onclick="logout()" class="text-red-400 hover:text-red-300"><i class="fas fa-sign-out-alt"></i></button>
                </div>
                <button onclick="toggleTheme()" class="text-green-400 text-xs flex items-center gap-2"><i class="fas fa-moon" id="theme-icon"></i> Toggle Mode</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative overflow-hidden bg-white/5 backdrop-blur-sm">
            <div id="view-dashboard" class="flex-1 p-6 h-full flex flex-col">
                <header class="flex justify-between items-center text-white mb-6">
                    <div>
                        <h1 class="text-4xl font-bold text-green-400" id="clock">00:00</h1>
                        <p class="text-sm font-bold opacity-80" id="date">Loading...</p>
                    </div>
                    <div id="header-avatar" class="w-12 h-12 rounded-full border-2 border-green-400 flex items-center justify-center overflow-hidden bg-purple-900">
                        <i class="fas fa-user text-white/50"></i>
                    </div>
                </header>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 min-h-0">
                    <div class="glass-panel rounded-2xl p-4 flex flex-col h-full">
                        <h2 class="text-sm font-bold mb-2 text-purple-700 dark:text-purple-300"><i class="fas fa-sticky-note mr-2"></i>Notes</h2>
                        <textarea id="notepad" class="flex-1 w-full bg-transparent border-none outline-none resize-none text-sm" placeholder="Private notes..." onchange="saveNotes(this.value)"></textarea>
                    </div>
                    <div class="lg:col-span-2 glass-panel rounded-2xl p-4 h-full flex flex-col overflow-hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-sm font-bold text-purple-700 dark:text-purple-300"><i class="fas fa-calendar-alt mr-2"></i>Schedule</h2>
                            <div class="flex gap-2">
                                <button onclick="changeMonth(-1)" class="text-xs hover:text-green-400"><i class="fas fa-chevron-left"></i></button>
                                <span id="calendar-month-year" class="text-xs font-bold w-32 text-center">...</span>
                                <button onclick="changeMonth(1)" class="text-xs hover:text-green-400"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-7 text-[10px] uppercase text-slate-500 font-bold mb-2 text-center">
                            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                        </div>
                        <div id="calendar-body" class="calendar-grid flex-1 overflow-y-auto"></div>
                    </div>
                </div>
            </div>

            <div id="view-kanban" class="flex-1 p-6 h-full flex flex-col hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-green-400">Task Tracker</h2>
                    <button onclick="openTaskModal()" class="bg-jokerGreen hover:bg-green-400 text-black font-black px-6 py-2 rounded-xl shadow-lg text-xs">
                        <i class="fas fa-plus"></i> NEW TASK
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-full min-h-0 overflow-hidden">
                    <div class="glass-panel rounded-2xl flex flex-col border-t-4 border-slate-400">
                        <div class="p-3 border-b flex justify-between font-bold text-sm"><span>To Do</span><span id="count-todo">0</span></div>
                        <div class="column-body p-3 flex-1 overflow-y-auto space-y-3" ondrop="drop(event, 'todo')" ondragover="allowDrop(event)"></div>
                    </div>
                    <div class="glass-panel rounded-2xl flex flex-col border-t-4 border-jokerPurple">
                        <div class="p-3 border-b flex justify-between font-bold text-sm"><span>In Progress</span><span id="count-inprogress">0</span></div>
                        <div class="column-body p-3 flex-1 overflow-y-auto space-y-3" ondrop="drop(event, 'inprogress')" ondragover="allowDrop(event)"></div>
                    </div>
                    <div class="glass-panel rounded-2xl flex flex-col border-t-4 border-jokerGreen">
                        <div class="p-3 border-b flex justify-between font-bold text-sm"><span>Executed</span><span id="count-done">0</span></div>
                        <div class="column-body p-3 flex-1 overflow-y-auto space-y-3" ondrop="drop(event, 'done')" ondragover="allowDrop(event)"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="task-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl border-2 border-purple-500 overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-bold mb-4 dark:text-white text-purple-800" id="modal-title">Task Details</h2>
            <input type="hidden" id="task-id">
            
            <div class="mb-3">
                <label class="block text-xs font-bold text-slate-500 uppercase">Title</label>
                <input type="text" id="task-title" class="w-full bg-slate-100 dark:bg-slate-700 rounded-lg p-3 outline-none dark:text-white">
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Assignee</label>
                    <select id="task-assignee" class="w-full bg-slate-100 dark:bg-slate-700 rounded-lg p-3 text-sm dark:text-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Main Date</label>
                    <input type="date" id="task-date" class="w-full bg-slate-100 dark:bg-slate-700 rounded-lg p-3 text-sm dark:text-white">
                </div>
            </div>

            <div id="duplicate-panel" class="hidden border-t-2 border-dashed border-purple-200 dark:border-slate-700 pt-4 mt-4 bg-purple-50/50 dark:bg-slate-900/30 p-4 rounded-xl">
                <label class="block text-xs font-black text-purple-600 uppercase mb-2"><i class="fas fa-calendar-plus mr-1"></i> Multi-Date Duplication</label>
                <p class="text-[10px] text-slate-500 mb-3">Click on the calendar to select all dates you want a copy on:</p>
                
                <input type="text" id="duplicate-multi-dates" class="w-full bg-white dark:bg-slate-800 border border-purple-300 dark:border-slate-600 rounded-lg p-3 text-sm outline-none mb-3 cursor-pointer" placeholder="Select additional dates...">
                
                <button onclick="confirmDuplicateAcrossDates()" class="w-full bg-purple-600 text-white text-xs font-bold py-3 rounded-lg hover:bg-purple-700 transition">
                    GENERATE COPIES FOR SELECTED DATES
                </button>
            </div>

            <div class="flex justify-between items-center mt-6">
                <button type="button" onclick="toggleDuplicateSection()" class="text-purple-500 hover:text-purple-700 text-xs font-bold">
                    <i class="fas fa-copy"></i> Duplicate for other dates
                </button>
                <div class="flex gap-2">
                    <button onclick="closeModal('task-modal')" class="px-4 py-2 text-slate-500">Cancel</button>
                    <button onclick="saveTask()" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-medium">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCvfwF-_by5hoUIVoEowKwbzzKF3YkJWy0",
            authDomain: "personalspacehub-3a44d.firebaseapp.com",
            projectId: "personalspacehub-3a44d",
            databaseURL: "https://personalspacehub-3a44d-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const store = {
            theme: localStorage.getItem('nexus_theme') || 'light',
            currentUser: null,
            users: [],
            kanbanTasks: [],
            avatars: {}, 
            notes: '',
            events: {},
            calendarMonth: new Date().getMonth(),
            calendarYear: new Date().getFullYear()
        };

        let draggedItem = null;
        let multiDatePicker = null;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
            loadTheme();
            
            // Setup multi-date picker for duplication
            multiDatePicker = flatpickr("#duplicate-multi-dates", {
                mode: "multiple",
                dateFormat: "Y-m-d",
                theme: "dark",
                minDate: "today"
            });

            db.ref('projectData').on('value', snap => {
                const data = snap.val() || {};
                store.users = data.users || [];
                store.kanbanTasks = data.kanbanTasks || [];
                store.avatars = data.avatars || {};
                
                const userKey = (store.currentUser || "Admin").replace(/[^a-zA-Z0-9]/g, '_');
                if(data.userData && data.userData[userKey]) {
                    store.notes = data.userData[userKey].notes || '';
                    store.events = data.userData[userKey].events || {};
                }
                
                renderTeamList();
                renderKanbanBoard();
                renderCalendar();
                document.getElementById('notepad').value = store.notes;
            });
        });

        function handleLogin() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            if (pass === "1234") { // Default demo pass
                document.getElementById('login-overlay').classList.add('hidden');
                store.currentUser = user === "Admin" ? null : user;
                document.getElementById('current-user-name').textContent = user;
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logout() { location.reload(); }

        function toggleTheme() {
            store.theme = store.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('nexus_theme', store.theme);
            loadTheme();
        }

        function loadTheme() {
            document.body.classList.toggle('dark', store.theme === 'dark');
            document.getElementById('theme-icon').className = store.theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        function switchView(v) {
            ['dashboard', 'kanban'].forEach(id => document.getElementById(`view-${id}`).classList.add('hidden'));
            ['nav-dashboard', 'nav-kanban'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById(`view-${v}`).classList.remove('hidden');
            document.getElementById(`nav-${v}`).classList.add('active');
        }

        // --- UPDATED DUPLICATION LOGIC ---
        function toggleDuplicateSection() {
            const panel = document.getElementById('duplicate-panel');
            panel.classList.toggle('hidden');
            if(!panel.classList.contains('hidden')) {
                multiDatePicker.clear();
            }
        }

        function confirmDuplicateAcrossDates() {
            const selectedDates = multiDatePicker.selectedDates;
            if (selectedDates.length === 0) return alert("Please select at least one date on the picker.");

            const title = document.getElementById('task-title').value;
            const desc = document.getElementById('task-desc').value || "";
            const assignee = document.getElementById('task-assignee').value;

            if(!title) return alert("Task needs a title before duplicating.");

            selectedDates.forEach(dateObj => {
                const dateStr = dateObj.toISOString().split('T')[0];
                const newId = Date.now().toString() + Math.floor(Math.random() * 1000);
                
                store.kanbanTasks.push({
                    id: newId,
                    title: title,
                    description: desc,
                    status: 'todo',
                    assignee: assignee || "Unassigned",
                    assignedDate: dateStr,
                    priority: 1,
                    lastMoved: Date.now()
                });
            });

            pushToCloud();
            alert(`Generated ${selectedDates.length} copies of this task.`);
            closeModal('task-modal');
        }

        function pushToCloud() {
            db.ref('projectData').update({
                users: store.users,
                kanbanTasks: store.kanbanTasks,
                avatars: store.avatars
            });
            const userKey = (store.currentUser || "Admin").replace(/[^a-zA-Z0-9]/g, '_');
            db.ref(`projectData/userData/${userKey}`).update({ notes: store.notes });
        }

        function renderKanbanBoard() {
            ['todo', 'inprogress', 'done'].forEach(s => {
                const col = document.querySelector(`[ondrop="drop(event, '${s}')"]`);
                if(!col) return;
                col.innerHTML = '';
                const tasks = store.kanbanTasks.filter(t => t.status === s && (!store.currentUser || t.assignee === store.currentUser));
                document.getElementById(`count-${s}`).textContent = tasks.length;
                tasks.forEach(t => {
                    const el = document.createElement('div');
                    el.className = 'task-card bg-white dark:bg-slate-800 p-3 rounded-lg border shadow-sm';
                    el.draggable = true;
                    el.ondragstart = (e) => { draggedItem = t.id; e.target.classList.add('dragging'); };
                    el.ondragend = (e) => e.target.classList.remove('dragging');
                    el.innerHTML = `
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-sm">${t.title}</h4>
                            <button onclick="openTaskModal('${t.id}')"><i class="fas fa-edit text-slate-400 text-xs"></i></button>
                        </div>
                        <div class="flex justify-between mt-2 text-[10px] text-slate-400 uppercase font-bold">
                            <span>${t.assignee}</span>
                            <span>${t.assignedDate || 'No Date'}</span>
                        </div>
                    `;
                    col.appendChild(el);
                });
            });
        }

        function drop(e, status) {
            e.preventDefault();
            const task = store.kanbanTasks.find(t => t.id === draggedItem);
            if(task) {
                task.status = status;
                task.lastMoved = Date.now();
                pushToCloud();
            }
        }

        function allowDrop(e) { e.preventDefault(); }

        function openTaskModal(id) {
            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('duplicate-panel').classList.add('hidden');
            const t = store.kanbanTasks.find(x => x.id === id) || {title:'', description:'', assignee:'', assignedDate:''};
            document.getElementById('task-id').value = id || '';
            document.getElementById('task-title').value = t.title;
            document.getElementById('task-desc').value = t.description || "";
            document.getElementById('task-assignee').value = t.assignee || "";
            document.getElementById('task-date').value = t.assignedDate || "";
        }

        function saveTask() {
            const id = document.getElementById('task-id').value;
            const data = {
                title: document.getElementById('task-title').value,
                description: document.getElementById('task-desc').value,
                assignee: document.getElementById('task-assignee').value,
                assignedDate: document.getElementById('task-date').value
            };
            if(id) {
                const existing = store.kanbanTasks.find(x => x.id === id);
                Object.assign(existing, data);
            } else {
                store.kanbanTasks.push({id: Date.now().toString(), ...data, status: 'todo', lastMoved: Date.now()});
            }
            pushToCloud();
            closeModal('task-modal');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function renderCalendar() {
            const grid = document.getElementById('calendar-body');
            const firstDay = new Date(store.calendarYear, store.calendarMonth, 1).getDay();
            const daysInMonth = new Date(store.calendarYear, store.calendarMonth + 1, 0).getDate();
            grid.innerHTML = '';
            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div class="bg-slate-100/20 dark:bg-slate-900/20 border-r border-b border-slate-200 dark:border-slate-800"></div>`;
            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${store.calendarYear}-${String(store.calendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const el = document.createElement('div');
                el.className = 'calendar-day relative';
                el.innerHTML = `<span class="text-[10px] font-bold opacity-40">${d}</span>`;
                const tasks = store.kanbanTasks.filter(t => t.assignedDate === dateStr && (!store.currentUser || t.assignee === store.currentUser));
                tasks.forEach(t => {
                    const tDiv = document.createElement('div');
                    tDiv.className = `cal-event-item text-[9px] truncate cursor-pointer ${t.status === 'done' ? 'opacity-50 line-through' : ''}`;
                    tDiv.textContent = t.title;
                    tDiv.onclick = () => openTaskModal(t.id);
                    el.appendChild(tDiv);
                });
                grid.appendChild(el);
            }
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-month-year').textContent = `${months[store.calendarMonth]} ${store.calendarYear}`;
        }

        function changeMonth(delta) {
            store.calendarMonth += delta;
            if(store.calendarMonth > 11) { store.calendarMonth = 0; store.calendarYear++; }
            if(store.calendarMonth < 0) { store.calendarMonth = 11; store.calendarYear--; }
            renderCalendar();
        }

        function renderTeamList() {
            const sel = document.getElementById('task-assignee');
            const val = sel.value;
            sel.innerHTML = '<option value="">Unassigned</option>';
            store.users.forEach(u => sel.add(new Option(u, u)));
            sel.value = val;
        }

        function saveNotes(v) { store.notes = v; pushToCloud(); }
        function updateClock() { 
            const n = new Date(); 
            document.getElementById('clock').textContent = n.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12: false}); 
            document.getElementById('date').textContent = n.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
        }
    </script>
</body>
</html>
