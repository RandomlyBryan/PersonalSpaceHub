<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonalSpace - Team Project Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        glass: "rgba(255, 255, 255, 0.95)",
                        darkGlass: "rgba(30, 41, 59, 0.95)",
                        sidebar: "rgba(36, 0, 70, 0.85)",
                        jokerPurple: "#3c096c",
                        jokerGreen: "#39ff14"
                    }
                }
            }
        }
    </script>

    <style>
        body { background: linear-gradient(135deg, #9d4edd, #70e000); min-height: 100vh; transition: background 0.5s ease; overflow: hidden; font-family: 'Inter', sans-serif; }
        .dark body { background: linear-gradient(135deg, #10002b, #004b23); }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(157, 78, 221, 0.3); box-shadow: 0 8px 32px 0 rgba(60, 9, 108, 0.2); }
        .dark .glass-panel { background: rgba(20, 10, 40, 0.85); color: #e2e8f0; border: 1px solid rgba(57, 255, 20, 0.1); }
        .sidebar { background: rgba(36, 0, 70, 0.7); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); }
        .nav-item.active { background: rgba(255, 255, 255, 0.1); border-left: 4px solid #39ff14; color: #39ff14; }
        .report-section-title { color: #39ff14; font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 8px; margin-top: 16px; }
        .eod-input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 13px; width: 100%; padding: 8px; border-radius: 8px; outline: none; }
        .eod-input-field:focus { border-color: #39ff14; }
        .task-card { cursor: grab; }
        .dragging { opacity: 0.5; transform: scale(0.98); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid rgba(0,0,0,0.1); border-left: 1px solid rgba(0,0,0,0.1); }
        .calendar-day { min-height: 85px; padding: 4px; font-size: 0.8rem; border-right: 1px solid rgba(0,0,0,0.1); border-bottom: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.4); }
        .dark .calendar-day { background: rgba(30, 41, 59, 0.4); border-color: #3c096c; }
        .calendar-day.today { background: #3c096c; color: #39ff14; font-weight: bold; border: 2px solid #39ff14; }
    </style>
</head>
<body class="text-slate-800 antialiased flex flex-col h-screen w-screen overflow-hidden">

    <div id="login-overlay" class="fixed inset-0 flex items-center justify-center transition-opacity duration-500 z-[200]">
        <div class="glass-panel p-8 rounded-3xl w-full max-sm:w-[90%] max-w-sm border-2 border-jokerPurple shadow-2xl">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 bg-jokerPurple rounded-2xl flex items-center justify-center border-2 border-jokerGreen shadow-lg">
                    <i class="fas fa-user-astronaut text-jokerGreen text-4xl"></i>
                </div>
            </div>
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-jokerGreen tracking-tighter">PersonalSpace</h1>
                <p class="text-white/50 text-xs uppercase">Secure Access</p>
            </div>
            <div class="space-y-4">
                <select id="login-username" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white outline-none appearance-none cursor-pointer">
                    <option value="Admin" class="text-slate-900">★ Admin</option>
                </select>
                <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white outline-none">
                <button onclick="handleLogin()" class="w-full bg-jokerGreen hover:bg-green-400 text-black font-black py-3 rounded-xl transition">ACCESS HUB</button>
            </div>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden relative">
        <aside class="sidebar w-64 flex-shrink-0 flex flex-col justify-between h-full z-20">
            <div class="p-6 text-white flex items-center gap-3">
                <div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center border border-green-400/50"><i class="fas fa-user-astronaut text-green-400 text-xl"></i></div>
                <div><h1 class="text-xl font-bold tracking-wider text-green-400">PersonalSpace</h1></div>
            </div>

            <nav class="flex-1 px-4 space-y-2">
                <button onclick="switchView('dashboard')" class="nav-item active w-full flex items-center gap-3 text-white px-4 py-3 rounded-r-lg transition">
                    <i class="fas fa-home w-5"></i> Dashboard
                </button>
                <button onclick="switchView('kanban')" class="nav-item w-full flex items-center gap-3 text-white px-4 py-3 rounded-r-lg transition">
                    <i class="fas fa-tasks w-5"></i> Task Tracker
                </button>
                <button onclick="generateDailyReport()" class="w-full flex items-center gap-3 text-white px-4 py-3 rounded-r-lg transition hover:bg-green-500/20 text-sm font-bold border-l-4 border-transparent hover:border-jokerGreen">
                    <i class="fas fa-file-alt w-5 text-jokerGreen"></i> Daily EOD Report
                </button>
            </nav>

            <div class="p-4 border-t border-purple-500/30">
                <h3 class="text-xs font-bold text-green-400 uppercase mb-3">Team Members <span id="member-count" class="bg-purple-800 px-2 rounded-full text-[10px]">0</span></h3>
                <ul id="team-list" class="space-y-2 max-h-40 overflow-y-auto pr-1"></ul>
            </div>
        </aside>

        <main class="flex-1 relative h-full overflow-hidden flex flex-col bg-white/5 backdrop-blur-sm">
            <div class="px-6 pt-4 shrink-0">
                <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-4 border-l-4 border-jokerGreen shadow-lg max-w-fit">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-bold text-purple-400 uppercase">Global Session</span>
                        <div id="global-timer-display" class="text-xl font-black font-mono text-white">00:00:00</div>
                    </div>
                    <div class="flex gap-2">
                        <button id="btn-clock-in" onclick="clockIn()" class="w-10 h-10 rounded-full bg-jokerGreen text-black flex items-center justify-center"><i class="fas fa-play"></i></button>
                        <button id="btn-clock-out" onclick="clockOut()" class="hidden w-10 h-10 rounded-full bg-red-500 text-white flex items-center justify-center"><i class="fas fa-stop"></i></button>
                    </div>
                </div>
            </div>

            <div id="view-dashboard" class="flex-1 p-6 flex flex-col h-full">
                <header class="mb-4 text-white shrink-0 flex justify-between items-center">
                    <div><h1 class="text-3xl font-bold text-green-400" id="clock">00:00</h1><p class="text-sm font-bold" id="date">...</p></div>
                    <div id="header-avatar" class="w-14 h-14 rounded-full border-2 border-green-400 bg-purple-900 overflow-hidden"></div>
                </header>
                <div id="calendar-body" class="calendar-grid flex-1 overflow-y-auto glass-panel rounded-2xl p-4"></div>
            </div>
        </main>
    </div>

    <div id="report-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden flex items-center justify-center z-[300] p-4">
        <div class="glass-panel rounded-3xl w-full max-w-2xl p-8 border-2 border-jokerGreen max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-4 text-white">
                <h2 class="text-2xl font-black text-jokerGreen uppercase tracking-tighter">EOD Daily Snapshot</h2>
                <button onclick="closeModal('report-modal')" class="text-white/50 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            
            <div id="report-content" class="overflow-y-auto pr-4 text-white font-sans text-sm space-y-4"></div>

            <div class="mt-6 flex gap-3 pt-4 border-t border-white/10">
                <button onclick="copyReportToClipboard()" class="flex-1 bg-jokerGreen text-black font-black py-3 rounded-xl hover:bg-green-400 transition shadow-lg">COPY TO CLIPBOARD</button>
                <button onclick="closeModal('report-modal')" class="px-6 py-3 text-white/50 font-bold">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCvfwF-_by5hoUIVoEowKwbzzKF3YkJWy0",
            authDomain: "personalspacehub-3a44d.firebaseapp.com",
            projectId: "personalspacehub-3a44d",
            databaseURL: "https://personalspacehub-3a44d-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const store = {
            currentUser: null,
            users: [],
            kanbanTasks: [],
            avatars: {},
            role: '', // Persistent role
            globalTimerSeconds: 0,
            globalTimerInterval: null
        };

        // --- AUTH ---
        function handleLogin() {
            const user = document.getElementById('login-username').value;
            store.currentUser = user === "Admin" ? null : user;
            document.getElementById('login-overlay').classList.add('hidden');
            switchUser(user === "Admin" ? "" : user);
        }

        async function switchUser(userName) {
            store.currentUser = userName || null;
            const userKey = (store.currentUser || "Admin").replace(/[^a-zA-Z0-9]/g, '_');
            
            // Fetch Persistent Data
            const snap = await db.ref(`projectData/userData/${userKey}`).once('value');
            const data = snap.val() || {};
            store.role = data.role || 'Link Building Associate';
            
            updateUI();
        }

        function updateUI() {
            renderCalendar();
            renderTeamList();
            updateClock();
            setInterval(updateClock, 1000);
        }

        function saveRole(val) {
            store.role = val;
            const userKey = (store.currentUser || "Admin").replace(/[^a-zA-Z0-9]/g, '_');
            db.ref(`projectData/userData/${userKey}`).update({ role: val });
        }

        // --- EOD REPORT ---
        async function generateDailyReport() {
            const user = store.currentUser || "Admin";
            const userKey = user.replace(/[^a-zA-Z0-9]/g, '_');
            const todayDate = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            const startOfToday = new Date().setHours(0,0,0,0);

            const attendanceSnap = await db.ref(`projectData/attendance/${new Date().toISOString().split('T')[0]}/${userKey}`).once('value');
            let totalSecs = 0;
            attendanceSnap.forEach(l => totalSecs += (l.val().rawSeconds || 0));

            const completed = store.kanbanTasks.filter(t => t.assignee === user && t.status === 'done' && t.lastMoved >= startOfToday);
            const ongoing = store.kanbanTasks.filter(t => t.assignee === user && t.status === 'inprogress');
            const priorities = [...store.kanbanTasks.filter(t => t.assignee === user && t.status === 'todo')].sort((a,b) => b.priority - a.priority).slice(0, 3);

            const html = `
                <div id="eod-text-container">
                    <div class="text-jokerGreen font-black">📌 EOD Report: ${user} - ${todayDate}</div>
                    <div class="report-section-title">Team Member Overview</div>
                    <ul class="ml-4 mb-4">
                        <li>• <b>Full Name:</b> ${user}</li>
                        <li>• <b>Role:</b> <input type="text" value="${store.role}" onchange="saveRole(this.value)" class="bg-transparent border-b border-white/20 outline-none text-jokerGreen"></li>
                        <li>• <b>Total Hours Worked:</b> ${totalSecs > 0 ? formatTime(totalSecs) : 'Calculated at Clock-out'}</li>
                    </ul>

                    <div class="report-section-title">Summary of Work</div>
                    <div class="font-bold mb-1">✅ Completed Work:</div>
                    <ul class="ml-4 mb-4">
                        ${completed.length ? completed.map(t => `<li>• ${t.title}: (1 update recorded)</li>`).join('') : '<li class="italic text-white/30">• None today</li>'}
                    </ul>

                    <div class="report-section-title">Current Status & Roadblocks</div>
                    <div class="font-bold text-blue-400 mb-1">🔄 Tasks in Progress:</div>
                    <ul class="ml-4 mb-2">
                        ${ongoing.length ? ongoing.map(t => `<li>• ${t.title}</li>`).join('') : '<li class="italic text-white/30">• None active</li>'}
                    </ul>
                    <div class="font-bold text-red-400 mb-1">🔴 Blockers:</div>
                    <textarea class="eod-input-field h-12" placeholder="N/A (or list project-specific issues)"></textarea>

                    <div class="report-section-title">Tomorrow's Focus</div>
                    <ul class="ml-4">
                        ${priorities.length ? priorities.map(t => `<li>• ${t.title}</li>`).join('') : '<li class="italic text-white/30">• No pending priorities</li>'}
                    </ul>
                </div>
            `;
            document.getElementById('report-content').innerHTML = html;
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function copyReportToClipboard() {
            const container = document.getElementById('eod-text-container');
            const blockers = container.querySelector('textarea').value || "N/A";
            let text = container.innerText.replace(/ Tomorrow's Focus/, `\n\n🔴 Blockers:\n• ${blockers}\n\nTomorrow's Focus`);
            navigator.clipboard.writeText(text).then(() => alert("EOD copied to clipboard!"));
        }

        // --- HELPERS ---
        function formatTime(s) { const h = Math.floor(s/3600), m = Math.floor((s%3600)/60); return `${h}h ${m}m`; }
        function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function switchView(v) { /* view logic */ }
        function renderCalendar() { /* calendar logic */ }
        function renderTeamList() { /* member logic */ }
    </script>
</body>
</html>
